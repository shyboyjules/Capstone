<div class="welcome-banner">
  <div class="welcome-content">
    <div class="welcome-text">
      <h1>Welcome back, <span id="welcome-student-name">Alex</span>! 👋</h1>
      <p>Here's your academic progress overview</p>
    </div>
    <div class="welcome-stats">
      <div class="welcome-stat">
        <div class="welcome-stat-value" id="current-week">1</div>
        <div class="welcome-stat-label">Current Week</div>
      </div>
      <div class="welcome-stat">
        <div class="welcome-stat-value" id="total-scores">0</div>
        <div class="welcome-stat-label">Total Scores</div>
      </div>
    </div>
  </div>
</div>

<section class="content-section active" id="dashboard-section">
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-header"><div class="stat-icon blue">📈</div></div>
      <div class="stat-value" id="average-score">0</div>
      <div class="stat-label">Average Score</div>
      <div class="stat-trend">↑ Keep it up!</div>
    </div>
    <div class="stat-card">
      <div class="stat-header"><div class="stat-icon green">⭐</div></div>
      <div class="stat-value" id="highest-score">0</div>
      <div class="stat-label">Highest Score</div>
      <div class="stat-trend">🎯 Personal Best</div>
    </div>
    <div class="stat-card">
      <div class="stat-header"><div class="stat-icon purple">🏆</div></div>
      <div class="stat-value" id="rank-position">-</div>
      <div class="stat-label">Your Rank</div>
      <div class="stat-trend">📊 Out of students</div>
    </div>
    <div class="stat-card">
      <div class="stat-header"><div class="stat-icon orange">📚</div></div>
      <div class="stat-value" id="total-weeks">0</div>
      <div class="stat-label">Weeks Completed</div>
      <div class="stat-trend">🔥 Stay consistent</div>
    </div>
  </div>
</section>
