<section class="content-section" id="scores-section">
  <div class="scores-header">
    <div>
      <h2 class="scores-title">My Scores</h2>
      <div class="scores-subtitle">Track weekly performance and progress</div>
    </div>
  </div>

  <div class="scores-container">
    <div class="scores-card">
      <div id="scores-grid" class="scores-grid">
        <!-- Empty state (visible when there are no scores). The app's renderScores() will replace this content when data exists. -->
        <div class="empty-state">
          <div class="empty-icon-card"><div class="empty-icon">📊</div></div>

          <div style="display:flex; flex-direction:column;">
            <div class="empty-text">No scores yet</div>
            <div class="empty-subtext">Add your first weekly score to get started.</div>
            <div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
