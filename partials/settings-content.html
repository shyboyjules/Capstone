<section class="content-section" id="settings-section">
  <div class="settings-container">
    <div class="settings-card">
      <h3 class="settings-card-title">Profile Information</h3>
      <form id="profile-form">
        <div class="form-group"><label class="form-label" for="profile-name">Full Name</label> <input type="text" id="profile-name" class="form-input" value="Alex Chen"></div>
        <div class="form-group"><label class="form-label" for="profile-email">Email Address</label> <input type="email" id="profile-email" class="form-input" value="alex.chen@school.edu"></div>
        <div class="form-group"><label class="form-label" for="profile-student-id">Student ID</label> <input type="text" id="profile-student-id" class="form-input" value="STU2024001"></div>
        <button type="submit" class="save-btn">Save Changes</button>
      </form>
    </div>
    <div class="settings-card">
      <h3 class="settings-card-title">Preferences</h3>
      <form id="preferences-form">
        <div class="form-group"><label class="form-label" for="theme">Theme</label><select id="theme" class="form-select"> <option value="light">Light Mode</option> <option value="dark">Dark Mode</option> <option value="auto">Auto</option> </select></div>
        <div class="form-group"><label class="form-label" for="notifications">Notifications</label><select id="notifications" class="form-select"> <option value="all">All Notifications</option> <option value="important">Important Only</option> <option value="none">None</option> </select></div>
        <button type="submit" class="save-btn">Save Preferences</button>
      </form>
    </div>
  </div>
</section>
