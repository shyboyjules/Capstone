<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Feedback</title>
  <link rel="stylesheet" href="../../css/feedback.css">
</head>
<body>

  <!-- Back Button -->
  <a href="../home_teacher.html" class="back-btn">🏠 Dashboard</a>

  <div class="feedback-container">
    <h2>All Feedback</h2>
    <div id="feedbackList">
      <p style="text-align:center; opacity:0.7;">Loading feedback...</p>
    </div>
  </div>

  <script type="module">
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
    import { app } from '../../DB/firebase.js';

    const db = getDatabase(app);
    const feedbackList = document.getElementById("feedbackList");
    const feedbackRef = ref(db, 'feedbacks');

    onValue(feedbackRef, (snapshot) => {
      feedbackList.innerHTML = "";

      if (!snapshot.exists()) {
        feedbackList.innerHTML = "<p style='text-align:center; opacity:0.7;'>No feedback yet.</p>";
        return;
      }

      const data = snapshot.val();
      // Sort by timestamp descending
      const feedbackArray = Object.values(data).sort((a,b) => {
        const tA = a.timestamp || 0;
        const tB = b.timestamp || 0;
        return tB - tA;
      });

      feedbackArray.forEach(item => {
        const text = item.feedback || "No text";
        const time = item.timestamp ? new Date(item.timestamp) : null;
        const formatted = time ? time.toLocaleString() : "Unknown time";

        const div = document.createElement("div");
        div.classList.add("feedback-item");
        div.innerHTML = `
          <p>${text}</p>
          <small>${formatted}</small>
        `;
        feedbackList.appendChild(div);
      });
    });
  </script>

</body>
</html>
