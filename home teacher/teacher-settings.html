<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Settings – MathQuest</title>
    
  <script type="module">
    import { protectRoute } from "../DB/Protect.js";
    protectRoute("teacher");
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard-bg">

<div class="dashboard-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="logo-area">
        <img src="../img/logo.png" alt="Logo" class="logo" />
        <h2>MathQuest</h2>
      </div>

      <div class="user-profile">
        <div class="profile-avatar" id="avatar">T</div>
        <div class="profile-info">
          <h4 id="profileName">Teacher Name</h4>
          <small>Teacher</small>
        </div>
      </div>

      <nav class="menu">
        <p class="menu-title">MAIN MENU</p>
        <a href="home_teacher.html" class="menu-item">🏠 Dashboard</a>
        <a href="teacher-question.html" class="menu-item">📝 Add Questions</a>
        <a href="teacher-students.html" class="menu-item">👩‍🏫 View Students</a>
        <a href="teacher-reports.html" class="menu-item">📊 Reports</a>

        <p class="menu-title">ACCOUNT</p>
        <a href="teacher-settings.html" class="menu-item active">⚙ Settings</a>
      </nav>
    </div>

    <div class="logout-area">
      <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <h1 class="page-title">⚙ Account Settings</h1>
    <p class="subtitle">Manage your account information and preferences</p>

    <div class="settings-container">

      <!-- Profile Settings -->
      <div class="settings-card">
        <h2>👤 Profile Information</h2>

        <label>Change Display Name</label>
        <input type="text" id="nameInput" placeholder="Enter new name">

        <label>Confirm Password</label>
        <input type="password" id="confirmPass" placeholder="Enter current password">

        <button class="save-btn">Save Changes</button>
      </div>

      <!-- Danger Zone -->
      <div class="settings-card danger-zone">
        <h2>⚠ Danger Zone</h2>
        <p>You cannot undo account deletion. Be careful.</p>
        <button class="delete-btn">Delete Account</button>
      </div>
    </div>
  </main>

</div>

<!-- JS -->
<script type="module">
  import { loadUserProfile } from "../DB/loadUserProfile.js";
  import {
    getAuth,
    signOut,
    deleteUser,
    EmailAuthProvider,
    reauthenticateWithCredential
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    update,
    remove
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

  import { app } from "../DB/firebase.js";

  loadUserProfile();

  const auth = getAuth(app);
  const db = getDatabase(app);

  const nameInput = document.getElementById("nameInput");
  const confirmPass = document.getElementById("confirmPass");
  const saveBtn = document.querySelector(".save-btn");

  // -------------------------------
  // SAVE CHANGES (name only)
  // -------------------------------
  saveBtn.addEventListener("click", async () => {
    const newName = nameInput.value.trim();
    const pass = confirmPass.value.trim();
    const user = auth.currentUser;

    if (!user) return alert("Not logged in.");
    if (!pass) return alert("You must enter your current password.");

    const credential = EmailAuthProvider.credential(user.email, pass);

    try {
      await reauthenticateWithCredential(user, credential);
    } catch (err) {
      console.error(err);
      return alert("❌ Incorrect password.");
    }

    try {
      if (newName) {
        await update(ref(db, "teachers/" + user.uid), { username: newName });
      }

      confirmPass.value = "";
      alert("✔ Your profile has been updated!");
    } catch (err) {
      console.error(err);
      alert("❌ Error saving changes.");
    }
  });

  // -------------------------------
  // DELETE ACCOUNT
  // -------------------------------
  document.querySelector(".delete-btn").addEventListener("click", async () => {
    const user = auth.currentUser;
    if (!user) return alert("Not logged in.");

    const pass = prompt("To delete your account, enter your password:");
    if (!pass) return alert("Password is required.");

    const credential = EmailAuthProvider.credential(user.email, pass);

    try {
      await reauthenticateWithCredential(user, credential);

      // Remove from Realtime Database
      await remove(ref(db, "teachers/" + user.uid));

      // Delete Authentication account
      await deleteUser(user);

      alert("✔ Your account has been deleted.");
      window.location.href = "../login and register/login.html";

    } catch (err) {
      console.error("Delete error:", err);

      if (err.code === "auth/wrong-password") {
        alert("❌ Incorrect password.");
      } else {
        alert("❌ Failed to delete account.");
      }
    }
  });

  // -------------------------------
  // LOGOUT
  // -------------------------------
  document.getElementById("logoutBtn").addEventListener("click", () => {
    signOut(auth).then(() => {
      window.location.href = "../login and register/login.html";
    });
  });
</script>

</body>
</html>
