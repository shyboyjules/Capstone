      <!-- DYNAMIC USER INFO -->

          <small>Teacher</small>

      <nav class="menu">
        <p class="menu-title">MAIN MENU</p>
        <a href="home_teacher.html" class="menu-item">🏠 Dashboard</a>
        <a href="teacher-question.html" class="menu-item active">📝 Add Questions</a>
        <a href="teacher-reports.html" class="menu-item active">📊 Reports</a>
       

        <p class="menu-title">ACCOUNT</p>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <!-- FILTERS -->

    <!-- REPORT TABLE -->
    <div class="report-table-wrapper">
      <table class="report-table">
        <thead>
          <tr>
            <th>User ID</th>

      <!-- Status styles -->
      <style>
        .status-select {
          padding: 6px 10px;
          border: 1px solid #ccc;
          border-radius: 4px;
          font-size: 14px;
          cursor: pointer;
        }
        .status-select.completed {
          background-color: #d4edda;
          color: #155724;
          border-color: #28a745;
        }
        .status-select.pending {
          background-color: #fff3cd;
          color: #856404;
          border-color: #ffc107;
        }
        .status-select.none {
          background-color: transparent;
          color: #6c757d;
          border-color: #ccc;
        }
      </style>
    </div>

  </main>
</div>

<script type="module">
  import { loadUserProfile } from "../DB/loadUserProfile.js";
  loadUserProfile();
</script>

<script type="module">
import { getDatabase, ref, get, child, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
import { app } from "../DB/firebase.js";

const db = getDatabase(app);

let usersCache = {};
let statsCache = {};
const userByStudentId = {};

// Load all User IDs from "Students/Stats"
async function loadStudentReports() {
  const statsRef = ref(db, "Students/Stats");

  try {
    const snapshot = await get(statsRef);

    if (!snapshot.exists()) {
      console.log("No student stats found");
      return;
    }

    const tableBody = document.getElementById("reportTableBody");
    tableBody.innerHTML = ""; // Clear table

    snapshot.forEach(childSnapshot => {
      const userId = childSnapshot.key; 
      const data = childSnapshot.val();

      // read correct/wrong from known DB keys (support legacy names)
      const correct = Number(data.CorrectAnswers ?? data.Correct ?? 0);
      const wrong = Number(data.WrongAnswers ?? data.Wrong ?? 0);
      const total = correct + wrong;
      const gradePercent = total > 0 ? Math.round((correct / total) * 100) : 0;

      // Get Student Name from userByStudentId lookup (built from users snapshot)
      const user = userByStudentId[userId] || {};
      const username = user.username || user.name || user.displayName || "Unknown";
      
      // Load status from localStorage (key: `student_status_${userId}`)
      const savedStatus = localStorage.getItem(`student_status_${userId}`) || "None";

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${userId}</td>
        <td>${username}</td>
        <td>${correct}</td>
        <td>${wrong}</td>
        <td>${gradePercent}%</td>
        <td>
          <select class="status-select status-${savedStatus.toLowerCase()}" 
                  id="status-${userId}" 
                  data-userid="${userId}"
                  onchange="updateStatus(this)">
            <option value="Completed" ${savedStatus === 'Completed' ? 'selected' : ''}>Completed</option>
            <option value="Pending" ${savedStatus === 'Pending' ? 'selected' : ''}>Pending</option>
            <option value="None" ${savedStatus === 'None' ? 'selected' : ''}>None</option>
          </select>
        </td>
      `;

      tableBody.appendChild(row);
    });

  } catch (error) {
    console.error("Error loading report list:", error);
  }
}

// LISTEN FOR REALTIME USER DATA (names) - builds userByStudentId map
onValue(ref(db, "users"), (snapshot) => {
  if (!snapshot.exists()) {
    usersCache = {};
    Object.keys(userByStudentId).forEach(k => delete userByStudentId[k]);
    return;
  }
  const allUsers = snapshot.val();
  usersCache = allUsers;

  // build map keyed by Student UserId (capital U)
  Object.keys(userByStudentId).forEach(k => delete userByStudentId[k]);
  for (const authUid in allUsers) {
    const u = allUsers[authUid];
    if (u && (u.UserId || u.userId)) {
      userByStudentId[u.UserId || u.userId] = u;
    }
  }

  // Reload reports to show updated names
  loadStudentReports();
});

// Update status in localStorage and apply visual styling
window.updateStatus = function(selectElement) {
  const userId = selectElement.dataset.userid;
  const status = selectElement.value;

  // Save to localStorage
  localStorage.setItem(`student_status_${userId}`, status);

  // Update visual classes
  selectElement.classList.remove('completed', 'pending', 'none');
  selectElement.classList.add(status.toLowerCase());

  console.log(`Status for ${userId} saved to localStorage: ${status}`);
};

loadStudentReports();
</script>




</body>
</html>
