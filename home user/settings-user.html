<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings – MathQuest</title>
  
  <script type="module">
    import { protectRoute } from "../DB/Protect.js";
    protectRoute("user");
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="dashboard-bg">

<div class="dashboard-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="logo-area">
        <img src="../img/logo.png" alt="Logo" class="logo" />
        <h2>MathQuest</h2>
      </div>

      <!-- DYNAMIC USER PROFILE -->
      <div class="user-profile">
        <div class="profile-avatar" id="avatar">U</div>
        <div class="profile-info">
          <h4 id="profileName">User Name</h4>
          <small id="profileRole">User</small>
        </div>
      </div>
      
      <!-- FIXED MENU STRUCTURE -->
      <nav class="menu">
        <p class="menu-title">MAIN MENU</p>
        <a href="Home.html" class="menu-item">🏠 Dashboard</a>
        <a href="scores-user.html" class="menu-item">📊 My Scores</a>
        <a href="leaderboard-user.html" class="menu-item">🏆 Leaderboard</a>

        <p class="menu-title">ACCOUNT</p>
        <a href="settings-user.html" class="menu-item active">⚙ Settings</a>
      </nav>
    </div>

    <!-- LOGOUT -->
    <div class="logout-area">
      <button class="logout-btn" id="logoutBtn">🚪 Log Out</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <h1 class="page-title">⚙ User Settings</h1>
    <p class="subtitle">Manage your preferences and account settings</p>

    <div class="settings-container">

      <!-- Account Settings -->
      <div class="settings-card">
        <h2>👤 Account</h2>

        <label>Change Display Name</label>
        <input type="text" id="nameInput" placeholder="Enter new name" />

        <label>Confirm Password</label>
        <input type="password" id="confirmPass" placeholder="Enter current password" />

        <button class="save-btn">Save Changes</button>
      </div>

      <!-- Danger Zone -->
      <div class="settings-card danger-zone">
        <h2>⚠ Danger Zone</h2>
        <p>You can't undo account deletion. Please be careful.</p>
        <button class="delete-btn">Delete Account</button>
      </div>

    </div>
  </main>
</div>

<!-- JS -->
<script type="module">
  import { loadUserProfile } from "../DB/loadUserProfile.js";
  import {
    getAuth,
    signOut,
    deleteUser,
    EmailAuthProvider,
    reauthenticateWithCredential
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    update,
    remove
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

  import { app } from "../DB/firebase.js";

  const auth = getAuth(app);
  const db = getDatabase(app);

  loadUserProfile();

  // ---- DOM ELEMENTS ----
  const nameInput = document.getElementById("nameInput");
  const confirmPass = document.getElementById("confirmPass");
  const saveBtn = document.querySelector(".save-btn");

  // -------------------------------
  //  SAVE CHANGES (Name Only)
  // -------------------------------
  saveBtn.addEventListener("click", async () => {
    const newName = nameInput.value.trim();
    const currentPass = confirmPass.value.trim();
    const user = auth.currentUser;

    if (!user) return alert("Not logged in.");
    if (!currentPass) return alert("You must enter your current password.");

    // Reauthenticate
    const credential = EmailAuthProvider.credential(user.email, currentPass);

    try {
      await reauthenticateWithCredential(user, credential);
      console.log("Reauthentication success.");
    } catch (err) {
      console.error("Reauth error:", err);
      return alert("❌ Incorrect password. Please try again.");
    }

    try {
      // UPDATE DISPLAY NAME ONLY
      if (newName) {
        await update(ref(db, "users/" + user.uid), { username: newName });
      }

      confirmPass.value = "";
      alert("✔ Account updated successfully!");

    } catch (err) {
      console.error("Account update error:", err);
      alert("❌ Error updating account. Check console.");
    }
  });

  // -------------------------------
  // DELETE ACCOUNT — FULLY WORKING
  // -------------------------------
  document.querySelector('.delete-btn').addEventListener('click', async () => {
    const user = auth.currentUser;
    if (!user) return alert("Not logged in.");

    const pass = prompt("To delete your account, enter your password:");

    if (!pass) return alert("Password is required.");

    const credential = EmailAuthProvider.credential(user.email, pass);

    try {
      // Reauthenticate
      await reauthenticateWithCredential(user, credential);

      // Delete from Realtime Database
      await remove(ref(db, "users/" + user.uid));

      // Delete from Firebase Auth
      await deleteUser(user);

      alert("✔ Your account has been deleted.");

      window.location.href = "../login and register/login.html";

    } catch (err) {
      console.error("Delete error:", err);

      if (err.code === "auth/wrong-password") {
        alert("❌ Incorrect password.");
      } else if (err.code === "auth/requires-recent-login") {
        alert("❌ Please log in again to delete your account.");
      } else {
        alert("❌ Failed to delete account.");
      }
    }
  });

  // -------------------------------
  // LOGOUT
  // -------------------------------
  const logoutBtn = document.querySelector(".logout-btn");

  logoutBtn.addEventListener("click", () => {
    signOut(auth)
      .then(() => window.location.href = "../login and register/login.html")
      .catch(err => {
        console.error(err);
        alert("❌ Logout failed.");
      });
  });
</script>


</body>
</html>
