<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Feedback</title>
  <link rel="stylesheet" href="../../css/feedback.css">
</head>
<body>

  <!-- Back Button -->
  <a href="../home user/Home.html" class="back-btn">🏠 Dashboard</a>

  <div class="feedback-container">
    <h2>Send Feedback</h2>
    <form id="feedbackForm">
      <textarea id="feedbackInput" placeholder="Write your feedback here..." required></textarea>
      <button type="submit" class="send-btn">Send Feedback</button>
      <p id="statusMessage" style="text-align:center; margin-top:10px;"></p>
    </form>
  </div>

  <script type="module">
    import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
    import { app } from '../../DB/firebase.js';

    const db = getDatabase(app);
    const feedbackForm = document.getElementById("feedbackForm");
    const feedbackInput = document.getElementById("feedbackInput");
    const statusMessage = document.getElementById("statusMessage");

    feedbackForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const feedbackText = feedbackInput.value.trim();
      if (!feedbackText) {
        statusMessage.textContent = "Please enter feedback before sending.";
        statusMessage.style.color = "red";
        return;
      }

      try {
        await push(ref(db, 'feedbacks'), {
          feedback: feedbackText,
          timestamp: serverTimestamp()
        });

        statusMessage.textContent = "Feedback sent successfully!";
        statusMessage.style.color = "lightgreen";
        feedbackInput.value = "";

      } catch (error) {
        statusMessage.textContent = "Error sending feedback: " + error.message;
        statusMessage.style.color = "red";
      }
    });
  </script>

</body>
</html>
