<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Dashboard – MathQuest</title>

  <!-- Protect student/user route -->
  <script type="module">
    import { protectRoute } from "../DB/Protect.js";
    protectRoute("user"); 
  </script>

  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="dashboard-bg">

<div class="dashboard-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>

      <!-- LOGO -->
      <div class="logo-area">
        <img src="../img/logo.png" alt="Logo" class="logo" />
        <h2>MathQuest</h2>
      </div>

      <!-- DYNAMIC USER PROFILE -->
      <div class="user-profile">
        <div class="profile-avatar">U</div>
        <div class="profile-info">
          <h4>User Name</h4>
          <small>User</small>
        </div>
      </div>

      <!-- MENU -->
      <nav class="menu">
        <p class="menu-title">MAIN MENU</p>

        <a href="Home.html" class="menu-item active">🏠 Dashboard</a>
        <a href="scores-user.html" class="menu-item">📊 My Scores</a>
        <a href="leaderboard-user.html" class="menu-item">🏆 Leaderboard</a>
        <a href="sendfeedback.html" class="menu-item">💬 Feedback</a>

        <p class="menu-title">ACCOUNT</p>
        <a href="settings-user.html" class="menu-item">⚙ Settings</a>
      </nav>
    </div>

    <!-- LOGOUT -->
    <button class="logout-btn" id="logoutBtn">🚪 Log Out</button>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <!-- TOP SECTION -->
    <section class="top-section">
      <div class="welcome-text">
        <h1>Welcome back, <span class="welcome-name">Student</span> 👋</h1>
        <p>Here’s your latest progress</p>
      </div>
    </section>

    <!-- DASHBOARD CARDS -->
    <section class="cards-grid">
      <div class="card" style="cursor: pointer;"onclick="window.location.href='scores-user.html'">
        <div class="icon">📈</div>
        <h3>85%</h3>
        <p>Latest Score</p>
        <small>Great job on Week 3!</small>
      </div>

      <div class="card" style="cursor: pointer;"onclick="window.location.href='leaderboard-user.html'">
        <div class="icon">🏆</div>
        <h3>#4</h3>
        <p>Highest Rank</p>
        <small>Leaderboard Position</small>
      </div>
  </main>
</div>

<script type="module">
  import { loadUserProfile } from "../DB/loadUserProfile.js";
  loadUserProfile();
</script>

<!-- DYNAMIC PROFILE + WELCOME NAME SCRIPT -->
<script type="module">
  import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { app } from "../DB/firebase.js";

  const auth = getAuth(app);
  const logoutBtn = document.getElementById("logoutBtn");

  logoutBtn.addEventListener("click", () => {
    signOut(auth)
      .then(() => {
        // Redirect to login
        window.location.href = "../login and register/login.html";
      })
      .catch((error) => {
        console.error("Logout failed:", error);
        alert("❌ Logout failed. Check console.");
      });
  });
</script>



</body>
</html>
