<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leaderboard – MathQuest</title>

  <!-- Protect Route -->
  <script type="module">
    import { protectRoute } from "../DB/Protect.js";
    protectRoute("user");
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="dashboard-bg">

<div class="dashboard-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="logo-area">
        <img src="../img/logo.png" alt="Logo" class="logo" />
        <h2>MathQuest</h2>
      </div>

      <div class="user-profile">
        <div class="profile-avatar">U</div>
        <div class="profile-info">
          <h4>User Name</h4>
          <small>User</small>
        </div>
      </div>

      <nav class="menu">
        <p class="menu-title">MAIN MENU</p>
        <a href="Home.html" class="menu-item">🏠 Dashboard</a>
        <a href="scores-user.html" class="menu-item">📊 My Scores</a>
        <a href="leaderboard-user.html" class="menu-item active">🏆 Leaderboard</a>

        <p class="menu-title">ACCOUNT</p>
        <a href="settings-user.html" class="menu-item">⚙ Settings</a>
      </nav>
    </div>

    <div class="logout-area">
      <button class="logout-btn" onclick="window.location.href='../login and register/login.html'">
        🚪 Log Out
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <h1 class="page-title">🏆 Leaderboard</h1>
    <p class="subtitle">See the top-performing students in MathQuest!</p>

    <div class="leaderboard-card">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Student Name</th>
            <th>User ID</th>
            <th>Correct</th>
            <th>Wrong</th>
            <th>Time Spent</th>
            <th>Level</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Load user profile -->
<script type="module">
  import { loadUserProfile } from "../DB/loadUserProfile.js";
  loadUserProfile();
</script>

<!-- Leaderboard Logic -->
<script type="module">
  import { getDatabase, ref, onValue } 
    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
  import { app } from "../DB/firebase.js";

  const db = getDatabase(app);

  let usersCache = {};
  let statsCache = {};

  const tbody = document.querySelector("tbody");

  // fast lookup: UserId → full user record
  const userByStudentId = {};

  function renderLeaderboard() {
    tbody.innerHTML = "";

    const ids = Object.keys(statsCache);

    if (ids.length === 0) {
      tbody.innerHTML = "<tr><td colspan='6'>No data found</td></tr>";
      return;
    }

    // SORT BY HIGHEST CORRECT ANSWERS
    ids.sort((a, b) => {
      const A = statsCache[a]?.CorrectAnswers || 0;
      const B = statsCache[b]?.CorrectAnswers || 0;

      if (B !== A) return B - A;

      // tie-breaker: lower TimeSpent wins
      const timeA = statsCache[a]?.TimeSpent || 0;
      const timeB = statsCache[b]?.TimeSpent || 0;
      return timeA - timeB;
    });

    ids.forEach((userId, index) => {
      const stats = statsCache[userId] || {};
      const user = userByStudentId[userId] || {};
      const name = user.username || user.name || user.displayName || "Unknown";

      const row = document.createElement("tr");

      // 🥇🥈🥉 Apply Top 3 highlight classes
      if (index === 0) row.classList.add("gold-row");
      if (index === 1) row.classList.add("silver-row");
      if (index === 2) row.classList.add("bronze-row");

      row.innerHTML = `
        <td>${name}</td>
        <td>${userId}</td>
        <td>${stats.CorrectAnswers || 0}</td>
        <td>${stats.WrongAnswers || 0}</td>
        <td>${stats.TimeSpent || 0}</td>
        <td>${stats.Level || 0}</td>
      `;

      tbody.appendChild(row);
    });
  }

  // STUDENT STATS LISTENER
  onValue(ref(db, "Students/Stats"), (snapshot) => {
    statsCache = snapshot.exists() ? snapshot.val() : {};
    renderLeaderboard();
  });

  // USER INFORMATION LISTENER
  onValue(ref(db, "users"), (snapshot) => {
    if (!snapshot.exists()) {
      usersCache = {};
      Object.keys(userByStudentId).forEach(k => delete userByStudentId[k]);
      renderLeaderboard();
      return;
    }

    const allUsers = snapshot.val();
    usersCache = allUsers;

    // rebuild userId lookup map
    Object.keys(userByStudentId).forEach(k => delete userByStudentId[k]);

    for (const authUid in allUsers) {
      const u = allUsers[authUid];
      if (u?.UserId || u?.userId) {
        userByStudentId[u.UserId || u.userId] = u;
      }
    }

    renderLeaderboard();
  });
</script>

</body>
</html>
