<!-- Leaderboard Logic -->
<script type="module">
  import { getDatabase, ref, update, onValue } 
    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
  import { app } from "../DB/firebase.js";

  const db = getDatabase(app);

  let usersCache = {};
  let statsCache = {};

  const tbody = document.querySelector("tbody");

  // RENDER TABLE
  function renderLeaderboard() {
    tbody.innerHTML = "";

    const ids = Object.keys(statsCache);
    if (ids.length === 0) {
      tbody.innerHTML = "<tr><td colspan='7'>No data found</td></tr>";
      return;
    }

    ids.forEach(userId => {
      const stats = statsCache[userId] || {};
      const user = userByStudentId[userId] || {};

      const name = user.username || user.name || user.displayName || "Unknown";

      const row = document.createElement("tr");

      row.innerHTML = `
        <td><input id="name-${userId}" value="${name}" disabled></td>
        <td>${userId}</td>
        <td><input id="correct-${userId}" type="number" value="${stats.CorrectAnswers || 0}"></td>
        <td><input id="wrong-${userId}" type="number" value="${stats.WrongAnswers || 0}"></td>
        <td><input id="time-${userId}" type="number" value="${stats.TimeSpent || 0}"></td>
        <td><input id="level-${userId}" type="number" value="${stats.Level || 0}"></td>
        <td><button onclick="saveStats('${userId}')">Save</button></td>
      `;

      tbody.appendChild(row);
    });
  }

  // fast lookup: map Student `UserId` -> user record
  const userByStudentId = {};

  // LISTEN FOR REALTIME STUDENT STATS
  onValue(ref(db, "Students/Stats"), (snapshot) => {
    statsCache = snapshot.exists() ? snapshot.val() : {};
    renderLeaderboard();
  });

  // LISTEN FOR REALTIME USER DATA (names)
  onValue(ref(db, "users"), (snapshot) => {
    if (!snapshot.exists()) {
      usersCache = {};
      Object.keys(userByStudentId).forEach(k => delete userByStudentId[k]);
      renderLeaderboard();
      return;
    }
    const allUsers = snapshot.val();
    usersCache = allUsers;

    // build map keyed by Student UserId (capital U)
    Object.keys(userByStudentId).forEach(k => delete userByStudestId[k]);
    for (const authUid in allUsers) {
      const u = allUsers[authUid];
      if (u && (u.UserId || u.userId)) {
        userByStudentId[u.UserId || u.userId] = u;
      }
    }

    renderLeaderboard();
  });

  // SAVE FUNCTION (Global)
  window.saveStats = async function (userId) {
    const correct = Number(document.getElementById(`correct-${userId}`).value);
    const wrong = Number(document.getElementById(`wrong-${userId}`).value);
    const time = Number(document.getElementById(`time-${userId}`).value);
    const level = Number(document.getElementById(`level-${userId}`).value);

    try {
      await update(ref(db, `Students/Stats/${userId}`), {
        CorrectAnswers: correct,
        WrongAnswers: wrong,
        TimeSpent: time,
        Level: level
      });

      alert("✅ Stats updated successfully!");
    } catch (err) {
      console.error(err);
      alert("❌ Failed to update stats.");
    }
  };
</script>

</body>
