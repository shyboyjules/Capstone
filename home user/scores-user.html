<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Scores – MathQuest</title>
  
  <script type="module">
  import { protectRoute } from "../DB/Protect.js";
  protectRoute("user");
  </script>

  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="dashboard-bg">

<div class="dashboard-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="logo-area">
        <img src="../img/logo.png" alt="Logo" class="logo" />
        <h2>MathQuest</h2>
      </div>

      <!-- DYNAMIC USER PROFILE -->
      <div class="user-profile">
        <div class="profile-avatar">U</div>
        <div class="profile-info">
          <h4>User Name</h4>
          <small>User</small>
        </div>
      </div>

      <nav class="menu">
        <p class="menu-title">MAIN MENU</p>
        <a href="Home.html" class="menu-item">🏠 Dashboard</a>
        <a href="scores-user.html" class="menu-item active">📊 My Scores</a>
        <a href="leaderboard-user.html" class="menu-item">🏆 Leaderboard</a>

        <p class="menu-title">ACCOUNT</p>
        <a href="settings-user.html" class="menu-item">⚙ Settings</a>
      </nav>
    </div>

    <button class="logout-btn" onclick="window.location.href='../login and register/login.html'">
      🚪 Log Out
    </button>
  </aside>


  <!-- MAIN CONTENT -->
  <main class="main-content">

    <div class="welcome-card">
      <div>
        <h1>📊 My Scores</h1>
        <p>Your weekly performance is shown below.</p>
      </div>
    </div>

    <!-- WRAPPED CONTENT (IMPORTANT) -->
    <div class="scores-wrapper">
      <table class="scores-table">
        <thead>
          <tr>
            <th>My User ID</th>
            <th>Correct</th>
            <th>Wrong</th>
            <th>Time Spent</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>

  </main>

</div>
<script type="module">
  import { loadUserProfile } from "../DB/loadUserProfile.js";
  loadUserProfile();
</script>

<script type="module">
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { ref, get, child, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
import { app, db } from "../DB/firebase.js";

const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    console.log("No user logged in");
    return;
  }
  console.log("User auth UID:", user.uid);

  // Listen for changes to users/<uid> to get userId, then listen to Students/Stats/<userId>
  const userRef = ref(db, `users/${user.uid}`);
  onValue(userRef, (userSnap) => {
    console.log("User doc exists:", userSnap.exists());
    if (!userSnap.exists()) {
      console.log("User record not found at users/" + user.uid);
      return;
    }
    const userData = userSnap.val();
    console.log("User data:", userData);
    const userId = userData.UserId;
    console.log("UserId:", userId);
    if (!userId) {
      console.log("No userId field in user record");
      return;
    }

    const statsRef = ref(db, `Students/Stats/${userId}`);
    const tbody = document.querySelector(".scores-table tbody");
    console.log("Listening to Students/Stats/" + userId);

    onValue(statsRef, (statsSnap) => {
      console.log("Stats snapshot exists:", statsSnap.exists());
      tbody.innerHTML = "";
      if (!statsSnap.exists()) {
        console.log("No stats data found for userId:", userId);
        tbody.innerHTML = `<tr><td colspan="4">No score data found.</td></tr>`;
        return;
      }
      const data = statsSnap.val();
      console.log("Stats data:", data);
      const correct = data.CorrectAnswers ?? 0;
      const wrong = data.WrongAnswers ?? 0;
      const timeSpent = data.TimeSpent ?? "0s";

      tbody.innerHTML = `
        <tr>
          <td>${userId}</td>
          <td>${correct}</td>
          <td>${wrong}</td>
          <td>${timeSpent}</td>
        </tr>
      `;
    });
  });
});
</script>


</body>
</html>
