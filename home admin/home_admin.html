<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard – MathQuest</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="dashboard-bg">

<div class="dashboard-wrapper">

  <!-- ================== SIDEBAR ================== -->
  <aside class="sidebar">
    <div>
      <div class="logo-area">
        <img src="../img/logo.png" class="logo" alt="Logo">
        <h2>MATHQUEST</h2>
      </div>

      <nav class="menu">
        <p class="menu-title">ADMIN MENU</p>
        <a href="home_admin.html" class="menu-item active">📊 Dashboard</a>
        <a href="admin-users.html" class="menu-item">👥 Users</a>
          
<p class="menu-title">ACCOUNT</p>
        <a href="admin-settings.html" class="menu-item">⚙ Settings</a>
      </nav>
    </div>

    <div class="logout-area">
      <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
    </div>
  </aside>

  <!-- ================== MAIN CONTENT ================== -->
  <main class="main-content">

    <!-- TOP RIGHT USER INFO -->
    <div class="top-right">
      <span class="bell-icon">🔔</span>
      <div class="profile-avatar">SJ</div>
      <div class="profile-info">
        <h4>Sarah Johnson</h4>
        <small>Administrator</small>
      </div>
    </div>

    <!-- TITLE -->
    <h1 class="page-title">📊 Admin Dashboard</h1>
    <p class="subtitle">Overview & Management Tools</p>

    <!-- DASHBOARD CARDS -->
    <div class="cards-grid">
      <div class="card admin-card">
        <div class="icon">👥</div>
        <h3>0</h3>
        <small>Total Users</small>
      </div>

      <div class="card admin-card">
        <div class="icon">👨‍🏫</div>
        <h3>0</h3>
        <small>Teachers</small>
      </div>

      <div class="card admin-card">
        <div class="icon">🧑‍🎓</div>
        <h3>0</h3>
        <small>Students</small>
      </div>

      <div class="card admin-card">
        <div class="icon">✔</div>
        <h3>0</h3>
        <small>Active Users</small>
      </div>
    </div>

    <!-- ACTIVITY LOG -->
    <div class="activity-placeholder">
      <h3>⚙ Latest Activity</h3>
      <p>System logs & activities will appear here.</p>
    </div>

  </main>
</div>

<!-- ================== FIREBASE LOGOUT ================== -->
<script type="module">
  import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { app } from "../DB/firebase.js";

  const auth = getAuth(app);

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try {
      await signOut(auth);
      alert("Logged out successfully!");
      window.location.href = "../landing/index.html";
    } catch (error) {
      console.error("Logout failed:", error);
      alert("Error logging out. Try again.");
    }
  });
</script>

</body>
</html>
