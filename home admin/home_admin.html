<!-- ================== FIREBASE USER INFO ================== -->
<script type="module">
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { app } from "../DB/firebase.js";
import { db } from "../DB/firebaseDB.js";
import { auth } from "../DB/firebaseAuth.js";




const profileNameEl = document.querySelector(".profile-info h4");
const profileRoleEl = document.querySelector(".profile-info small");
const profileAvatarEl = document.querySelector(".profile-avatar");

onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  const userDoc = await getDoc(doc(db, "users", user.uid));
  if (!userDoc.exists()) return;

  const data = userDoc.data();

  profileNameEl.textContent = data.username;
  profileRoleEl.textContent = data.role[0].toUpperCase() + data.role.slice(1);

  const initials = data.username
    .split(" ")
    .map(word => word[0].toUpperCase())
    .join("")
    .slice(0, 2);

  profileAvatarEl.textContent = initials;
});
</script>



<!-- ================== FIRESTORE DASHBOARD COUNTERS ================== -->
<script type="module">
import {
  getFirestore,
  collection,
  getDocs,
  Timestamp
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

import { app } from "../DB/firebase.js";
import { db } from "../DB/firebaseDB.js";

const totalUsersEl = document.querySelectorAll(".admin-card h3")[0];
const teachersEl   = document.querySelectorAll(".admin-card h3")[1];
const studentsEl   = document.querySelectorAll(".admin-card h3")[2];
const activeEl     = document.querySelectorAll(".admin-card h3")[3];

async function loadDashboardCounts() {
  try {
    const usersRef = collection(db, "users");
    const snapshot = await getDocs(usersRef);

    let total = 0;
    let teachers = 0;
    let students = 0;
    let active = 0;

    const now = new Date();
    const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

    snapshot.forEach((doc) => {
      const user = doc.data();

      total++;

      if (user.role === "teacher") teachers++;
      if (user.role === "student" || user.role === "user") students++;

     
      if (user.lastLogin) {
        let lastLoginDate;
        if (user.lastLogin.toDate) {
          lastLoginDate = user.lastLogin.toDate();
        } else {
          lastLoginDate = new Date(user.lastLogin);
        }
        if (lastLoginDate >= sevenDaysAgo) active++;
      }
    });

    totalUsersEl.textContent = total;
    teachersEl.textContent = teachers;
    studentsEl.textContent = students;
    activeEl.textContent = active;

  } catch (err) {
    console.error("Error loading dashboard counts:", err);
  }
}


loadDashboardCounts();
</script>

<script type="module">
import { db } from "../DB/firebaseDB.js";
import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { app } from "../DB/firebase.js";


const activityList = document.getElementById("activityList");

async function loadLatestActivity() {
  try {
    
    const usersRef = collection(db, "users");
    const q = query(usersRef, orderBy("createdAt", "desc"), limit(10));
    const snapshot = await getDocs(q);

    activityList.innerHTML = ""; 

    snapshot.forEach(doc => {
      const user = doc.data();
      const li = document.createElement("li");

      
      let createdAt = new Date(user.createdAt);
      let timeStr = createdAt.toLocaleString();

      li.textContent = `🆕 ${user.username} (${user.role}) joined on ${timeStr}`;
      activityList.appendChild(li);
    });

  } catch (err) {
    console.error("Error loading latest activity:", err);
    activityList.innerHTML = "<li>Failed to load activity.</li>";
  }
}


loadLatestActivity();

//auto-refresh every 30 seconds
setInterval(loadLatestActivity, 30000); 
</script>
