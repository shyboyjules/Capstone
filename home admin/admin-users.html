<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Manage Users</title>

  <!-- PROTECT ADMIN ROUTE -->
  <script type="module">
    import { protectRoute } from "../DB/Protect.js";
    protectRoute("admin");
  </script>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="dashboard-bg">

<div class="dashboard-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="logo-area">
        <img src="../img/logo.png" class="logo" alt="Logo">
        <h2>MATHQUEST</h2>
      </div>

      <nav class="menu">
        <p class="menu-title">ADMIN MENU</p>
        <a href="home_admin.html" class="menu-item">📊 Dashboard</a>
        <a href="admin-users.html" class="menu-item active">👥 Users</a>
        
        <p class="menu-title">ACCOUNT</p>
        <a href="admin-settings.html" class="menu-item">⚙ Settings</a>
      </nav>
    </div>

    <div class="logout-area">
      <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <h1 class="page-title">👥 User Management</h1>
    <p class="subtitle">View, manage, and search users</p>

    <!-- SEARCH BAR -->
    <div class="search-area">
      <input type="text" id="searchInput" placeholder="🔍 Search users by name or email..." class="search-input">
      <button class="save-btn" onclick="filterUsers()">Search</button>
    </div>

    <!-- USERS TABLE -->
    <div class="table-container">
      <table class="scores-table" id="userTable">
        <thead>
          <tr>
            <th>Full Name</th>
            <th>Role</th>
            <th>Email</th>
            <th>Status</th>
            <th style="text-align:center">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </main>
</div>

<!-- JS FOR SEARCH FILTER -->
<script>
function filterUsers() {
  const input = document.getElementById("searchInput").value.toLowerCase();
  const rows = document.querySelectorAll("#userTable tbody tr");

  rows.forEach(row => {
    const cells = row.querySelectorAll("td");
    let match = false;
    for (let i = 0; i < cells.length - 1; i++) {
      if ((cells[i].textContent || "").toLowerCase().includes(input)) { match = true; break; }
    }
    row.style.display = match ? "" : "none";
  });
}
</script>

<!-- LOAD USERS AND EDIT ROLE -->
<script type="module">
import { app } from "../DB/firebase.js";

// ===== CHANGED: Import Realtime Database instead of Firestore
import { getDatabase, ref, get, child, update, remove } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
import { logoutUser } from "../DB/auth.js";

const db = getDatabase(app);
const tableBody = document.querySelector("#userTable tbody");

// =====================
// LOAD USERS
// =====================
async function loadUsers() {
  // ===== CHANGED: Realtime DB ref and get() instead of Firestore collection/getDocs
  const usersRef = ref(db, "users");
  const snapshot = await get(usersRef);

  tableBody.innerHTML = "";

  if (snapshot.exists()) {
    const usersData = snapshot.val();
    Object.entries(usersData).forEach(([userId, user]) => {
      // defensive defaults for missing/legacy fields
      const displayName = (user && (user.username || user.name || user.fullName)) ? (user.username || user.name || user.fullName) : "Unknown";
      const displayRole = (user && user.role) ? user.role : "user";
      const displayEmail = (user && user.email) ? user.email : "—";
      const isActive = (user && typeof user.active !== 'undefined') ? !!user.active : true;

      const row = document.createElement("tr");
      row.dataset.id = userId;
      row.innerHTML = `
        <td>${displayName}</td>
        <td>${displayRole}</td>
        <td>${displayEmail}</td>
        <td class="${isActive ? "status-completed" : "status-pending"}">
          ${isActive ? "Active" : "Inactive"}
        </td>
        <td style="text-align:center">
          <button class="btn-warning" data-id="${userId}">Edit</button>
          <button class="btn-danger" data-id="${userId}">Delete</button>
        </td>
      `;
      tableBody.appendChild(row);
    });
  }

  console.log("✅ User list loaded.");
}

// =====================
// EDIT USER ROLE
// =====================
tableBody.addEventListener("click", async (e) => {
  if (e.target.classList.contains("btn-warning")) {
    const userId = e.target.getAttribute("data-id");
    const currentRole = e.target.parentElement.parentElement.children[1].textContent;

    // Do not allow editing an Admin role from this page
    if (currentRole && currentRole.toLowerCase() === 'admin') {
      return alert('❌ Cannot change Admin role from this interface.');
    }

    const newRole = promptRole(currentRole);
    if (!newRole || newRole === currentRole) return;

    try {
      // ===== CHANGED: Realtime DB update() instead of Firestore updateDoc()
      const userRef = ref(db, "users/" + userId);
      await update(userRef, { role: newRole });

      // Update table display
      e.target.parentElement.parentElement.children[1].textContent = newRole;
      alert("✅ User role updated successfully!");
    } catch (err) {
      console.error("Error updating user role:", err);
      alert("❌ Failed to update role.");
    }
  }
  // Delete user record from Realtime Database
  if (e.target.classList.contains("btn-danger")) {
    const userId = e.target.getAttribute("data-id");
    if (!confirm("Are you sure you want to delete this user? This will remove their record from the database.")) return;
    try {
      const userRef = ref(db, "users/" + userId);
      await remove(userRef);
      // remove row from table
      const row = e.target.closest('tr');
      if (row) row.remove();
      alert("✅ User deleted successfully.");
    } catch (err) {
      console.error("Error deleting user:", err);
      alert("❌ Failed to delete user.");
    }
  }
});

// =====================
// PROMPT ROLE SELECTION
// =====================
function promptRole(currentRole) {
  const roles = ["user", "teacher"];
  const defaultIndex = roles.indexOf(currentRole) >= 0 ? roles.indexOf(currentRole) + 1 : 1;
  let selection = prompt(
    `Edit role for this user (type number):\n1. user\n2. teacher\n(Current role: ${currentRole})`,
    defaultIndex
  );
  if (!selection) return null;

  const index = parseInt(selection) - 1;
  if (index < 0 || index >= roles.length) return null;

  return roles[index];
}

// =====================
// INITIALIZE
// =====================
document.addEventListener("DOMContentLoaded", loadUsers);
// wire logout button
document.getElementById("logoutBtn").addEventListener("click", logoutUser);
</script>

</body>
</html>
