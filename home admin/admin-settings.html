<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Settings – MathQuest</title>

  <script type="module">
    import { protectRoute } from "../DB/Protect.js";
    protectRoute("admin");
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="dashboard-bg">

<div class="dashboard-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="logo-area">
        <img src="../img/logo.png" class="logo" alt="Logo">
        <h2>MATHQUEST</h2>
      </div>

      <nav class="menu">
        <p class="menu-title">ADMIN MENU</p>
        <a href="home_admin.html" class="menu-item">📊 Dashboard</a>
        <a href="admin-users.html" class="menu-item">👥 Users</a>

        <p class="menu-title">ACCOUNT</p>
        <a href="admin-settings.html" class="menu-item active">⚙ Settings</a>
      </nav>
    </div>

    <div class="logout-area">
      <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <h1 class="page-title">⚙ Admin Settings</h1>
    <p class="subtitle">Manage your account information</p>

    <div class="settings-container">

      <!-- ACCOUNT SETTINGS (same as teacher) -->
      <div class="settings-card">
        <h2>👤 Account Information</h2>

        <label>Display Name</label>
        <input type="text" id="nameInput" placeholder="Enter new name" />

        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Enter new password" />

        <button class="save-btn" id="saveAccountBtn">Save Changes</button>
      </div>

      <!-- DELETE ACCOUNT -->
      <div class="settings-card danger-zone">
        <h2>⚠ Danger Zone</h2>
        <p>Deleting your Admin account is permanent.</p>
        <button class="delete-btn" id="deleteAdminBtn">Delete Account</button>
      </div>

    </div>
  </main>
</div>

<!-- JS AREA -->
<script type="module">
import { app } from "../DB/firebase.js";
import { getAuth, EmailAuthProvider, updatePassword, reauthenticateWithCredential } 
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import { getDatabase, ref, update, get } 
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

import { logoutUser } from "../DB/auth.js";

const auth = getAuth(app);
const db = getDatabase(app);

// =========================
// LOAD CURRENT NAME
// =========================
auth.onAuthStateChanged(async (user) => {
  if (!user) return;

  const userRef = ref(db, "users/" + user.uid);
  const snap = await get(userRef);

  if (snap.exists()) {
    document.getElementById("nameInput").value = snap.val().username || "";
  }
});

// =========================
// SAVE CHANGES
// =========================
document.getElementById("saveAccountBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) return alert("❌ No logged-in user found.");

  const newName = document.getElementById("nameInput").value.trim();
  const newPassword = document.getElementById("passwordInput").value;

  const userRef = ref(db, "users/" + user.uid);

  let updates = {};

  if (newName) updates.username = newName;

  try {
    if (newPassword) await updatePassword(user, newPassword);

    if (Object.keys(updates).length > 0) {
      await update(userRef, updates);
    }

    alert("✅ Changes saved successfully!");
  } catch (err) {
    console.error(err);
    alert("❌ Failed to save changes.");
  }
});

// =========================
// DELETE ACCOUNT
// =========================
document.getElementById("deleteAdminBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) return alert("❌ No logged-in user.");

  const userRef = ref(db, "users/" + user.uid);
  const snap = await get(userRef);

  if (!snap.exists() || snap.val().role !== "admin")
    return alert("❌ Only admin accounts can delete themselves.");

  if (!confirm("Are you sure? This cannot be undone.")) return;

  // PASSWORD CONFIRMATION FOR SECURITY
  const password = prompt("Enter your password to confirm:");
  if (!password) return alert("❌ Password is required.");

  try {
    const cred = EmailAuthProvider.credential(user.email, password);

    await reauthenticateWithCredential(user, cred);

    // Delete Auth
    await user.delete();

    // Delete DB record (optional)
    update(userRef, null);

    alert("✅ Admin account deleted.");
    window.location.href = "../landing/index.html";

  } catch (err) {
    console.error(err);
    alert("❌ Incorrect password or failed to delete.");
  }
});

// LOGOUT
document.getElementById("logoutBtn").addEventListener("click", logoutUser);

</script>

</body>
</html>
